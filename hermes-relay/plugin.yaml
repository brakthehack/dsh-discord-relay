name: dsh-discord-relay
version: 0.1.0
description: >-
  Relay DeepSeek Harness agent questions to your configured Discord channel
  (set channelId in the config file) with clickable option buttons (plus a
  type-your-own-answer modal), and return the owner's answer to the blocked
  agent over the local dsh bridge.
author: dsh-discord-relay contributors
kind: standalone
# Deliberately empty, not an omission (DECISIONS.md 12). This plugin registers
# no tools and overrides no tool: it polls the local dsh bridge and posts to
# one Discord channel, through its own HTTP client. `tools.override` is only
# ever checked here because the loader probes every plugin for it, so the
# periodic `capability_check ... decision=deny` line is a probe of a capability
# we do not want — leaving it undeclared would keep that noise unexplained.
capabilities: []
provides_tools: []
